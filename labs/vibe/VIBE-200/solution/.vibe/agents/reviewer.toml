agent_type = "agent"
display_name = "Reviewer"
description = "Read-only code-review agent for the textkit repo."
safety = "safe"

# Read and search only. No write_file, no search_replace, no bash - a reviewer
# reasons about code, it does not change it.
enabled_tools = ["read_file", "grep", "task"]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"
