agent_type = "agent"
display_name = "Reviewer"
description = "Everyday code-review agent for the textkit repo."
safety = "safe"

# A reviewer reads and reasons about code - it should NOT be able to change
# files or run shell commands. As written, this agent can still edit and write
# files, so a review run could quietly modify the code it was asked to review.
# Task 4: scope this agent down to only what a reviewer legitimately needs,
# then confirm with the verify check.
enabled_tools = ["read_file", "grep", "search_replace", "write_file"]
