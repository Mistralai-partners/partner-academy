# hooks.toml - extend the Vibe Code agent loop.
#
# Discovery: the CLI reads `<project>/.vibe/hooks.toml` (this file, when the
# folder is trusted) and, for user scope, `$VIBE_HOME/hooks.toml`. Each
# [[hooks]] entry is validated against the HookConfig schema.
#
# Fields: name (unique), type (pre_tool|post_tool|post_agent), command,
# match (glob on tool_name; tool hooks only), strict (bool; tool hooks only),
# timeout (default 60), description.
#
# SYMPTOM: this loop runs UNGUARDED and leaves NO audit trail. The one hook
# below is not fail-closed, and nothing records which tools actually ran or
# when a turn ended.

# TODO(Task 1): make this guard fail-closed and scope it to the shell tool.
[[hooks]]
name = "bash-guard"
type = "pre_tool"
command = "python3 .vibe/hooks/guard.py"
description = "Should deny destructive shell commands - but see guard.py."

# TODO(Task 1): add a post_tool hook that appends every executed tool call to
# audit.log (see .vibe/hooks/audit.py), and a post_agent hook that records a
# turn boundary (see .vibe/hooks/gate.py). Remember: match/strict are NOT
# valid on post_agent.
