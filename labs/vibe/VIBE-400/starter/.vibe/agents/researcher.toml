# researcher.toml - intended to be a delegation-only SUBAGENT.
# A subagent (agent_type = "subagent") is NOT user-selectable; the model
# spawns it through the `task` tool and it returns TEXT-ONLY results. A plain
# agent (agent_type = "agent") is user-facing and selectable via --agent.
#
# SYMPTOM: as written this is a user-selectable agent that can write files.
# It should be a read-only, delegation-only subagent instead.

# TODO(Task 3): make this a delegation-only subagent, and drop write access.
agent_type   = "agent"
display_name = "Researcher"
description  = "Research helper."
safety       = "safe"
enabled_tools = ["grep", "read_file", "write_file"]
