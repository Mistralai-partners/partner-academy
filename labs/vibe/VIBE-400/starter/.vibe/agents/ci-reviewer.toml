# ci-reviewer.toml - a user-facing custom agent profile.
# Select at launch with:  vibe --agent ci-reviewer
# An agent is a set of config OVERRIDES layered on top of the global config.
#
# Intended posture: a code reviewer for untrusted fork PRs - it must READ and
# SEARCH but never mutate the tree or run shell commands.
#
# SYMPTOM: this "reviewer" can edit files and run the shell on an untrusted
# checkout. That is far more blast radius than reviewing a PR needs.

agent_type   = "agent"
display_name = "CI reviewer"
description  = "Reviewer for untrusted PRs."
safety       = "safe"           # NOTE: visual hint only - it does NOT enforce anything

# TODO(Task 2): tighten enabled_tools to least privilege for a reviewer.
enabled_tools = ["read_file", "grep", "write_file", "search_replace", "bash"]
