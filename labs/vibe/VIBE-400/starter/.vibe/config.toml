# config.toml - the project-level permission posture for this repo.
#
# Precedence (highest to lowest): CLI flags > env vars > project
# ./.vibe/config.toml > user ~/.vibe/config.toml. A selected --agent profile
# overrides the merged config for that run. Project config loads only when the
# folder is TRUSTED.
#
# SYMPTOM: bash is blanket-allowed. Under this posture even a routine run can
# execute `rm -rf` or `git push` with no prompt and no block - there is no
# denylist for destructive commands.

default_agent = "plan"

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

# TODO(Task 4): stop blanket-allowing the shell. Set bash to "ask" and add a
# deny list for destructive commands (a denylist match wins even under an
# always/auto-approve posture). Optionally extend the allow list with known
# safe project commands.
[tools.bash]
permission = "always"
